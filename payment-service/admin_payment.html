<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin – Payment Transactions</title><style>body{font-family:Arial,sans-serif;margin:2rem;color:#17202a;background:#f5f7fb}main{max-width:1100px;margin:auto;background:#fff;padding:1.5rem;border-radius:12px;box-shadow:0 4px 18px #0001}h1{margin-top:0}button{padding:.55rem .9rem;cursor:pointer}#notice{margin:1rem 0;padding:.75rem;border-radius:6px;background:#eef3ff}#notice.error{background:#ffe9e9;color:#9b1c1c}table{border-collapse:collapse;width:100%;margin-top:1rem}th,td{border-bottom:1px solid #e5e7eb;padding:.7rem;text-align:left}th{background:#f0f3f8}.PAID{color:#087f5b;font-weight:700}.FAILED{color:#c92a2a;font-weight:700}</style></head><body><main><h1>Lịch sử giao dịch Payment</h1><button id="reload" type="button">Tải lại</button><div id="notice">Đang tải dữ liệu...</div><table><thead><tr><th>Booking ID</th><th>Số tiền (VND)</th><th>Phương thức</th><th>Trạng thái</th><th>Thời gian</th></tr></thead><tbody id="rows"></tbody></table></main><script>const API_URL=window.PAYMENT_API_URL||'http://localhost:5005/api/payment';const notice=document.querySelector('#notice'),rows=document.querySelector('#rows'),formatter=new Intl.NumberFormat('vi-VN');async function loadPayments(){notice.className='';notice.textContent='Đang tải dữ liệu...';rows.innerHTML='';try{const response=await fetch(API_URL);if(!response.ok)throw new Error(`HTTP ${response.status}`);const payments=await response.json();payments.forEach(item=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${item.bookingId}</td><td>${formatter.format(item.amount)}</td><td>${item.method}</td><td class="${item.status}">${item.status}</td><td>${new Date(item.paidAt).toLocaleString('vi-VN')}</td>`;rows.appendChild(tr)});notice.textContent=`Đã tải ${payments.length} giao dịch.`}catch(error){notice.className='error';notice.textContent=`Không thể tải Payment Service: ${error.message}`}}document.querySelector('#reload').addEventListener('click',loadPayments);loadPayments();</script></body></html>
